<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10172e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickSpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="PickSpot 전시회 작품 감상과 투표">
  <title>PickSpot | 전시회 투표</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#/" aria-label="PickSpot 홈"><img class="brand-icon" src="assets/pickspot_logo.png" alt=""><span class="brand-name">PickSpot</span></a>
      <nav class="top-nav" aria-label="주 메뉴">
        <a href="#/">진행 중</a><a href="#/archive">지난 전시회</a>
      </nav>
      <button class="header-results" id="header-results" type="button" hidden><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#chart-column-increasing"></use></svg><span>실시간 현황</span></button>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer"><span>당신의 선택이 빛나는 곳, PickSpot</span><a href="admin.html">巫堂先生</a></footer>
  </div>
  <div class="modal-backdrop" id="results-backdrop" hidden></div>
  <section class="results-sheet" id="results-sheet" role="dialog" aria-modal="true" aria-labelledby="results-title" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-heading"><div><span class="eyebrow">VOTE BOARD</span><h2 id="results-title">개표 현황</h2></div><button class="icon-button" id="close-results" type="button" aria-label="결과 닫기"><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#x"></use></svg></button></div>
    <div id="results-content"></div>
  </section>
  <div class="poster-backdrop" id="poster-backdrop" hidden></div>
  <section class="poster-dialog" id="poster-dialog" role="dialog" aria-modal="true" aria-labelledby="poster-title" hidden>
    <header class="poster-dialog-header"><h2 id="poster-title"></h2><button id="close-poster" type="button" aria-label="작품 크게보기 닫기"><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#x"></use></svg></button></header>
    <div class="poster-dialog-body" id="poster-swipe-area"><button class="poster-arrow" id="poster-prev" type="button" aria-label="이전 작품"><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#arrow-left"></use></svg></button><img id="poster-image" alt=""><span class="poster-no-image" id="poster-no-image" hidden>등록된 작품 이미지가 없습니다.</span><button class="poster-arrow" id="poster-next" type="button" aria-label="다음 작품"><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#arrow-right"></use></svg></button></div>
    <footer class="poster-dialog-footer"><span id="poster-position" aria-live="polite"></span><button class="poster-vote-button" id="poster-vote" type="button"><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#vote"></use></svg><span class="button-label">투표하기</span></button></footer>
  </section>
  <div class="vote-confirm-backdrop" id="vote-confirm-backdrop" hidden></div>
  <section class="vote-confirm-dialog" id="vote-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="vote-confirm-title" hidden>
    <h2 id="vote-confirm-title">이 작품에 투표하시겠습니까?</h2>
    <div class="vote-confirm-actions"><button id="cancel-vote" type="button">취소</button><button id="confirm-vote" type="button">확인</button></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
