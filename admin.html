<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PickSpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>巫堂先生 | PickSpot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header"><a class="brand" href="index.html" aria-label="PickSpot 홈"><img class="brand-icon" src="assets/pickspot_logo.webp" width="96" height="96" alt=""><span class="brand-name">PickSpot</span></a><span class="admin-label">巫堂先生</span><a class="admin-home" href="index.html">관람객 화면 <svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#arrow-up-right"></use></svg></a></header>
    <main class="admin-main">
      <div class="admin-heading"><span class="eyebrow gold">EXHIBITION MANAGER</span><h1>전시회 운영</h1><p>새 전시회를 만들고 투표 상태를 관리합니다.</p></div>
      <div class="demo-banner" id="admin-demo" hidden><strong>Firebase 연결 필요</strong><span>관리자 로그인을 사용하려면 Firebase 프로젝트를 연결하세요.</span></div>
      <section class="admin-panel" id="login-panel" hidden><h2>巫堂先生 로그인</h2><form id="login-form"><label>이메일<input name="email" type="email" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button class="admin-primary" type="submit">로그인</button></form></section>
      <div id="admin-workspace" hidden>
        <div class="admin-actions"><button type="button" class="admin-secondary" id="sign-out">로그아웃</button></div>
        <section class="admin-panel"><div class="admin-section-heading"><div><span class="eyebrow">CURRENT & PAST</span><h2>전시회 목록</h2></div></div><div id="admin-exhibitions" class="admin-list"></div></section>
        <section class="admin-panel" id="editor-panel"><div class="admin-section-heading"><div><span class="eyebrow" id="editor-kicker">NEW EXHIBITION</span><h2 id="editor-heading">새 전시회 만들기</h2></div></div><form id="exhibition-form"><div class="form-grid"><label>전시회 제목<input name="title" maxlength="80" placeholder="예: 2026 겨울 아이디어 전시회"></label><label>소개<textarea name="description" maxlength="500" rows="3" placeholder="관람객에게 보여줄 전시회 소개"></textarea></label></div><div class="work-form-heading"><h3>작품</h3><button class="admin-secondary" id="add-work" type="button"><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#plus"></use></svg>작품 추가</button></div><div id="work-fields"></div><p class="form-hint" id="editor-hint">작품 이미지는 라이브러리에서 선택합니다. 중간저장한 초안은 관람객에게 보이지 않습니다.</p><div class="editor-actions"><button class="admin-secondary" id="save-draft" type="button">중간저장</button><button class="admin-primary" id="save-exhibition" type="submit"><span class="button-label">전시회 열기</span><svg class="lucide-icon" aria-hidden="true" focusable="false"><use href="assets/lucide-icons.svg#arrow-up-right"></use></svg></button><button class="admin-secondary" id="cancel-edit" type="button" hidden>편집 취소</button></div></form></section>
      </div>
      <p class="admin-message" id="admin-message" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script type="module" src="admin.js"></script>
  <script type="module" src="update.js"></script>
</body>
</html>
